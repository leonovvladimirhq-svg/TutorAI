services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./secrets:/secrets:ro
    # Из сети YC (RKN-фильтрация egress) достижим только канонический IP api.telegram.org
    # 149.154.167.220; DNS отдаёт и другие адреса Telegram, которые отсюда не маршрутизируются,
    # а также IPv6 (egress по IPv6 у one-to-one NAT нет). Прибиваем имя к рабочему IPv4.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"

volumes:
  postgres-data:
